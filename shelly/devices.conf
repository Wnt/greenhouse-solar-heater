# Device IP addresses — DHCP reservations on UniFi (Greenhouse VLAN 30)
# All devices on WiFi via "Kasvihuone IoT" SSID on VLAN 30.
# Used by deploy.sh
#
# ETH_*: static IPs for the wired control path (see system.yaml
# shelly_components.networking). The Pro devices share an isolated Ethernet
# switch with no upstream and no DHCP; deploy.sh provisions these as STATIC
# addresses on each device's Ethernet interface. Deliberately a different
# subnet than WiFi — two interfaces in one /24 would misroute LAN traffic
# into the isolated switch. Valve commands from the 4PM try the wire first
# and fall back to WiFi (VALVES map in control.js).

PRO4PM=192.168.30.50
ETH_PRO4PM=192.168.31.50

# Pro 2PM valve controllers (no scripts deployed, listed for reference)
# IP assignments match VALVES map in control.js
PRO2PM_1=192.168.30.51  # Valve Control 1: vi_btm, vi_top (input manifold)
PRO2PM_2=192.168.30.52  # Valve Control 2: vi_coll, vo_coll (input/output manifold)
PRO2PM_3=192.168.30.53  # Valve Control 3: vo_rad, vo_tank (output manifold)
PRO2PM_4=192.168.30.54  # Valve Control 4: v_air on output 1 (id 0). Output 2 (id 1) is a reserved spare — spec 024 replaced the collector-top return valve with a passive T joint.
ETH_PRO2PM_1=192.168.31.51
ETH_PRO2PM_2=192.168.31.52
ETH_PRO2PM_3=192.168.31.53
ETH_PRO2PM_4=192.168.31.54

# Sensor hub — the former valve-spare Pro 2PM (.55) carrying the 1-Wire
# sensor Add-on (all 5 DS18B20 probes on one bus). Replaced the two
# WiFi-only Shelly 1 Gen3 hubs (.20/.21) 2026-07 so sensing rides the
# Ethernet island; the 4PM polls it wired-first. See
# design/docs/sensor-hub-pro-migration.md. There is no valve-spare unit
# anymore (only the spare relay on PRO2PM_4 output 2).
SENSOR_1=192.168.30.55
ETH_SENSOR_1=192.168.31.55

