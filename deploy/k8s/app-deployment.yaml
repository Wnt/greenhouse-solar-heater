apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: greenhouse
spec:
  replicas: 1
  strategy:
    # Recreate is required because the mosquitto sidecar binds hostPort 1883 on
    # the VLAN-30 address (192.168.30.5) so the Shelly devices can reach the
    # broker. Two pods cannot bind the same hostPort on a single node, so the
    # old pod must terminate before the new one can schedule.
    type: Recreate
  selector:
    matchLabels:
      app: greenhouse
  template:
    metadata:
      labels:
        app: greenhouse
    spec:
      terminationGracePeriodSeconds: 5
      # ── App container ──
      containers:
        - name: app
          image: ghcr.io/wnt/greenhouse-solar-heater:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3

        # ── Mosquitto sidecar ──
        - name: mosquitto
          image: eclipse-mosquitto:2-openssl
          ports:
            # hostPort on the node's VLAN-30 interface: the Shelly devices sit
            # on 192.168.30.0/24 and publish straight to it (layer-2, no VPN,
            # no firewall rule). The app container reaches it on localhost.
            - name: mqtt
              containerPort: 1883
              hostIP: 192.168.30.5
              hostPort: 1883
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1883
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config
              readOnly: true
            - name: mosquitto-data
              mountPath: /mosquitto/data
            - name: mosquitto-log
              mountPath: /mosquitto/log
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 30

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: mosquitto-config
          configMap:
            name: mosquitto-config
        - name: mosquitto-data
          emptyDir:
            sizeLimit: 64Mi
        - name: mosquitto-log
          emptyDir:
            sizeLimit: 16Mi
