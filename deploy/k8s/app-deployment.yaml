apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: greenhouse
spec:
  replicas: 1
  strategy:
    # Still Recreate, but for a different reason than before. The openvpn sidecar
    # (the original hostPort 1194 holder) is gone; mosquitto now takes hostPort
    # 1883 so the Shelly devices can reach the broker directly. Two pods still
    # cannot bind the same hostPort on one node, so the old pod must terminate
    # before the new one schedules.
    type: Recreate
  selector:
    matchLabels:
      app: greenhouse
  template:
    metadata:
      labels:
        app: greenhouse
    spec:
      terminationGracePeriodSeconds: 5
      # The vpn-firewall init container is gone with the VPN. It existed to
      # restrict UDP 1194 to whitelisted CIDRs and TCP 1883 to the tunnel, on a
      # node that had a public IP. This node has no public address at all — it
      # sits on a home LAN behind the UDM Pro, and the only inbound path from the
      # internet is the SNI-routed tunnel from the edge box to ingress-nginx.
      # MQTT exposure is now bounded by binding the hostPort to a single
      # interface (see hostIP below) instead of by iptables.
      containers:
        # ── App container ──
        - name: app
          image: ghcr.io/wnt/greenhouse-solar-heater:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3

        # ── Mosquitto sidecar ──
        - name: mosquitto
          image: eclipse-mosquitto:2-openssl
          ports:
            - name: mqtt
              containerPort: 1883
              # Reachable by the Shelly devices at 192.168.30.5:1883.
              #
              # hostIP pins the listener to the node's VLAN-30 interface ONLY.
              # Without it, hostPort binds 0.0.0.0 and the anonymous-allowed
              # broker would also be reachable from the whole home LAN. The
              # devices share this subnet with the node, so no inter-VLAN
              # routing and no UniFi firewall rule is involved — this is plain
              # layer 2. The devices' MQTT server setting points here instead of
              # at the old VPN address 10.10.10.1.
              hostIP: 192.168.30.5
              hostPort: 1883
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1883
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config
              readOnly: true
            - name: mosquitto-data
              mountPath: /mosquitto/data
            - name: mosquitto-log
              mountPath: /mosquitto/log
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 30

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: mosquitto-config
          configMap:
            name: mosquitto-config
        - name: mosquitto-data
          emptyDir:
            sizeLimit: 64Mi
        - name: mosquitto-log
          emptyDir:
            sizeLimit: 16Mi
