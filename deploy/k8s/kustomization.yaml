apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# node-firewall.yaml is deliberately NOT included. It was a hardening DaemonSet
# for the UpCloud worker, which had a public IP: it inserted an iptables chain
# into the node's INPUT to reject everything except 80/443/kubelet/API and the
# VPN whitelist. The k3s node has no public address — it is on a home LAN behind
# the UDM Pro, with the edge box as the only inbound path — so the DaemonSet
# would add privileged host-level iptables rules for no gain, and its rules
# assume the old pod/service CIDRs.
resources:
  - cluster-issuer.yaml
  - deployer-rbac.yaml
  - app-deployment.yaml
  - services.yaml
  - ingress.yaml
  - preview-gc-cronjob.yaml
  - cloud-admin.yaml
  - k8s-api-proxy.yaml
  - watcher-deployment.yaml
